<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Descendencia — Familia Echenagucia</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Lora:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap');

:root{
  --cream:#F4EBD6;
  --parchment:#EFE1BF;
  --ochre:#B9863B;
  --ochre-deep:#8A5E22;
  --terracotta:#A8481F;
  --bark:#4A3620;
  --ink:#2E2412;
  --ink-soft:#6B5A3E;
  --olive:#5C6B37;
  --line:#C7A96B;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--cream);
  background-image:
    radial-gradient(circle at 15% 0%, rgba(185,134,59,0.12), transparent 45%),
    radial-gradient(circle at 90% 100%, rgba(168,72,31,0.08), transparent 45%);
  color:var(--ink);
  font-family:'Lora', serif;
  padding-bottom:1.5rem;
}
.wrap{max-width:1900px;margin:0 auto;padding:1.25rem 1rem;}

.hero{text-align:center;margin-bottom:0.5rem;}
.crest-img{
  width:64px;height:auto;border-radius:6px;margin:0 auto 0.4rem;
  box-shadow:0 0 0 3px var(--parchment), 0 0 0 4px var(--ochre);
  display:block;
}
h1{
  font-family:'Fraunces', serif; font-weight:700; font-size:clamp(20px,2.6vw,30px);
  margin:0 0 0.15rem; color:var(--ochre-deep); letter-spacing:0.3px;
}
.subtitle{color:var(--ink-soft); font-size:13px; margin:0 0 0.25rem;}
.spelling-note{
  font-family:'JetBrains Mono', monospace; font-size:10.5px; color:var(--terracotta);
  background:rgba(168,72,31,0.08); display:inline-block; padding:2px 9px; border-radius:12px;
}

.notice{
  background:var(--parchment);
  border:1px solid var(--line);
  border-left:4px solid var(--terracotta);
  border-radius:8px;
  padding:0.5rem 0.9rem;
  font-size:12px;
  color:var(--ink-soft);
  margin:0.6rem auto;
  max-width:900px;
}
.notice b{color:var(--ink);}

.toolbar{
  display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-bottom:0.6rem;
}
.btn{
  font-family:'Lora', serif; font-size:13.5px; cursor:pointer;
  background:var(--terracotta); color:#fff;
  border:1px solid var(--ochre-deep); border-radius:20px;
  padding:8px 18px;
}
.btn:hover{background:var(--ochre-deep);}
.btn.secondary{background:transparent; color:var(--terracotta); border:1px solid var(--terracotta);}
.btn.secondary:hover{background:rgba(168,72,31,0.08);}

.navbar{
  display:flex; gap:8px; flex-wrap:wrap; align-items:center; justify-content:center;
  margin-bottom:0.6rem; font-family:'JetBrains Mono', monospace; font-size:12.5px;
}
.navbar select{
  font-family:'Lora', serif; font-size:13px; color:var(--ink);
  border:1px solid var(--ochre); border-radius:16px; padding:6px 12px; background:#fff;
}
.zoomctl{
  display:flex; gap:4px; align-items:center;
}
.zoombtn{
  width:30px;height:30px;border-radius:50%; border:1px solid var(--ochre); background:#fff;
  color:var(--ochre-deep); font-size:16px; cursor:pointer; display:flex;align-items:center;justify-content:center;
  line-height:1;
}
.zoombtn:hover{ background:var(--parchment); }

.viewport{
  position:relative; overflow:hidden; border:1px solid var(--line); border-radius:12px;
  background:var(--parchment); height:88vh; min-height:560px;
  touch-action:none; cursor:grab;
}
.viewport.dragging{ cursor:grabbing; }
.hint{
  position:absolute; bottom:10px; left:50%; transform:translateX(-50%);
  font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--ink-soft);
  background:rgba(244,235,214,0.9); padding:3px 12px; border-radius:12px; pointer-events:none;
  border:1px solid var(--line);
}

.org{list-style:none; margin:0; padding:20px 10px 0; display:flex; justify-content:center; align-items:flex-start;}
.org ul{list-style:none; margin:0; padding:24px 0 0; display:flex; align-items:flex-start;}
.org li{
  flex:0 0 auto; text-align:center; list-style:none; position:relative;
  padding:24px 18px 0 18px;
}
.org li::before, .org li::after{
  content:''; position:absolute; top:0; right:50%;
  border-top:2px solid var(--line); width:50%; height:24px;
}
.org li::after{ right:auto; left:50%; border-left:2px solid var(--line); }
.org li:only-child::after, .org li:only-child::before{ display:none; }
.org li:only-child{ padding-top:0; }
.org li:first-child::before{ border:none; }
.org li:last-child::after{ border:none; }
.org li:first-child::after{ border-radius:6px 0 0 0; }
.org li:last-child::before{ border-right:2px solid var(--line); border-radius:0 6px 0 0; }
.org > li{ padding-top:0; }
.org > li::before, .org > li::after{ display:none; }
.canvas{ position:absolute; top:0; left:0; transform-origin:0 0; padding:20px 20px 90px; }

.node{ display:inline-flex; flex-direction:column; align-items:center; cursor:pointer; }
.couple-row{ display:flex; align-items:center; gap:2px; }
.avatar-btn{ border:none; background:none; padding:0; cursor:pointer; }
.avatar{
  width:60px;height:60px;border-radius:50%;
  background:var(--parchment); border:2.5px solid var(--ochre);
  display:flex;align-items:center;justify-content:center; overflow:hidden;
  transition:transform .12s, border-color .12s;
}
.avatar:hover{ border-color:var(--terracotta); transform:scale(1.05); }
.avatar img{width:100%;height:100%;object-fit:cover;}
.avatar svg{width:70%;height:70%;}
.ring-icon{ font-size:13px; color:var(--ochre-deep); margin:0 -4px; z-index:2; }
.node-name{
  font-family:'Fraunces', serif; font-weight:600; font-size:12.5px; color:var(--ink);
  margin-top:6px; max-width:130px; line-height:1.25;
}
.node-years{ font-family:'JetBrains Mono', monospace; font-size:10px; color:var(--ink-soft); }
.node-spouse-name{ font-family:'Lora', serif; font-style:italic; font-size:11px; color:var(--olive); }
.uncertain-dot{ color:var(--terracotta); font-weight:700; }

.branch-toggle{
  font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--terracotta);
  background:#fff; border:1px solid var(--ochre); border-radius:10px;
  padding:1px 8px; cursor:pointer; margin-top:5px;
}
.branch-toggle:hover{ background:var(--parchment); }
.add-inline{
  font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--olive);
  background:none; border:1px dashed var(--olive); border-radius:10px;
  padding:1px 7px; cursor:pointer; margin-top:4px;
}
.add-inline:hover{ background:rgba(92,107,55,0.1); }
.hidden{display:none !important;}

.overlay{
  position:fixed; inset:0; background:rgba(46,36,18,0.6);
  display:flex; align-items:center; justify-content:center; z-index:50; padding:1rem;
}
.modal{
  background:var(--cream); border:1px solid var(--ochre);
  border-radius:14px; max-width:420px; width:100%;
  padding:1.5rem; max-height:88vh; overflow-y:auto;
}
.modal h3{font-family:'Fraunces',serif; margin:0 0 1rem; color:var(--ochre-deep); font-size:19px;}
.field{margin-bottom:12px;}
.field label{display:block; font-size:12px; color:var(--ink-soft); margin-bottom:4px; font-family:'JetBrains Mono',monospace;}
.field input, .field textarea, .field select{
  width:100%; font-family:'Lora',serif; font-size:14px;
  border:1px solid var(--line); border-radius:6px; padding:7px 9px;
  background:#fff; color:var(--ink);
}
.field textarea{resize:vertical; min-height:50px;}
.photo-row{display:flex; align-items:center; gap:12px; margin-bottom:12px;}
.photo-preview{
  width:60px;height:60px;border-radius:50%; background:var(--parchment); border:2px solid var(--ochre);
  display:flex;align-items:center;justify-content:center; overflow:hidden; flex-shrink:0;
}
.photo-preview img{width:100%;height:100%;object-fit:cover;}
.photo-preview svg{width:70%;height:70%;}
.modal-actions{display:flex; gap:8px; justify-content:flex-end; margin-top:16px; flex-wrap:wrap;}
.btn.danger{background:#fff; color:var(--terracotta); border:1px solid var(--terracotta);}
.btn.danger:hover{background:#fdece4;}

.savebar{
  position:fixed; bottom:0; left:0; right:0; background:var(--ochre-deep); color:#fff;
  text-align:center; font-size:12.5px; padding:6px; font-family:'JetBrains Mono',monospace;
  transform:translateY(100%); transition:transform .3s; z-index:40;
}
.savebar.show{transform:translateY(0);}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <img class="crest-img" src="data:image/jpeg;base64,PLACEHOLDER_IMAGE_TOO_LARGE_FOR_CHAT" alt="Escudo de armas de la familia Echenagusia/Echenagucia">
    <h1>Descendencia Echenagucia</h1>
    <p class="subtitle">Desde el Coronel Enrique Domínguez</p>
    <span class="spelling-note">el escudo histórico dice "Echenagusia" (con S) — nuestra rama lo escribe "Echenagucia" (con C)</span>
  </div>
